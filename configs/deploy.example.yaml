project:
  name: "TrafficDetect"

paths:
  weights_dir: "weights"
  results_dir: "result"
  dataset_dir: "datasets"
  obstacle_dataset_dir: "datasets/idd_animal_yolo"

model:
  base: "yolov8s.pt"
  custom_yaml: "configs/model_yolov8s_custom.yaml"
  baseline_yaml: "yolov8s.yaml"
  input_size: 640
  num_classes: 10

training:
  epochs: 100
  batch_size: 16
  optimizer: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: true
  amp: true
  workers: 4
  patience: 20
  close_mosaic: 15
  quick_epochs: 2

augmentation:
  mosaic: 1.0
  mixup: 0.1
  copy_paste: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  erasing: 0.4

classes:
  names: ["pedestrian", "rider", "car", "truck", "bus", "train", "motorcycle", "bicycle", "traffic light", "traffic sign"]
  ch_names: ["行人", "骑行者", "小汽车", "卡车", "公交车", "列车", "摩托车", "自行车", "交通灯", "交通标志"]

web:
  title: "TrafficDetect Web"
  best_model: "best.pt"
  default_conf: 0.25
  default_iou: 0.45
  default_module: "traffic"
  modules:
    traffic:
      title: "交通目标检测"
      subtitle: "BDD100K 10 类交通目标识别"
      best_model: "best.pt"
    obstacle:
      title: "道路动物识别"
      subtitle: "IDD animal 单类检测"
      best_model: "animal_best.pt"

data_sources:
  bdd100k_raw: "datasets_raw/bdd100k/100k"
  roadobstacle21_raw: "datasets_raw/roadobstacle21/dataset_ObstacleTrack"
  sod_raw: "datasets_raw/Small_Obstacle_Dataset"
  idd_detection_raw: "datasets_raw/IDD_Detection"

obstacle_classes:
  names: ["animal"]
  ch_names: ["道路动物"]

obstacle_task: "detect"
obstacle_model: "yolo11n.pt"
obstacle_base: "yolo11n.pt"
obstacle_epochs: 100
obstacle_imgsz: 960
obstacle_batch_size: 32
obstacle_workers: 8
obstacle_patience: 20
obstacle_supports_batch: true
obstacle_supports_stream: false
obstacle_supports_masks: false
obstacle_supports_boxes: true
obstacle_supports_sequence_input: true
